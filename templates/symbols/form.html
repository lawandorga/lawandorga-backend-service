{# Generic form. Parameters: form, submit (button text), mark_invalid (mark all fields invalid on a non-field error, e.g. sign in). #}
{% include 'symbols/errors.html' %}
<form method="POST" class="lo-form" novalidate>
    {% csrf_token %}
    {% for field in form %}
        {% include 'symbols/field.html' with field=field %}
    {% endfor %}
    <button type="submit" class="lo-btn lo-btn-primary">{{ submit }}</button>
</form>
