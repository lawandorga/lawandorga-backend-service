{% load static %}<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>{% block title %}{% endblock %} – Law&amp;Orga</title>
    <link rel="icon" href="{% static 'logo256blue.png' %}" />
    <link rel="stylesheet" href="{% static 'tailwind.css' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="lo-auth{% block body_class %}{% endblock %}">
    {% block body %}
        {% block header %}{% include 'symbols/header.html' %}{% endblock header %}
        <main class="lo-page lo-page-narrow">
            {% block content %}
            {% endblock content %}
        </main>
    {% endblock %}
    {% include 'symbols/scripts.html' %}
</body>

</html>
